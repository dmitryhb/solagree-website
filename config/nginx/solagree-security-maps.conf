# Include once in nginx's http context, before the website server configuration.
# Existing public quiz and legacy co-branded embeds remain embeddable too.
map $solagree_policy_uri $solagree_frame_policy {
    default "frame-ancestors 'self'";
    ~^/(?:quiz/embed(?:/index\.html)?|(?:cdfa/)?go/[^/]+/embed|co-branded/[^/]+/embed)/?$ "";
}
map $host $solagree_environment_robots {
    default "noindex, nofollow";
    www.solagree.com "";
    solagree.com "";
}
# Extensionless routes and SPA families are HTML; versioned/static assets keep
# their existing cache policy. Internal index.html redirects also match.
map $solagree_policy_uri $solagree_html_cache {
    default "no-cache";
    ~^/(?:meet|go|cdfa/go|webinars)/ "no-cache";
    ~*\.html$ "no-cache";
    ~\.[^/]+$ "";
}
