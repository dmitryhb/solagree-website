# Include inside the Website server alongside legacy and dynamic route snippets.
# Dynamic /meet, /go and /webinars locations retain their dedicated SPA fallback.
# Preserve the normalized route while named SPA fallbacks serve /200.html.
set $solagree_policy_uri $uri;

location ^~ /meet/ {
    set $co_branded_noindex_header "noindex, nofollow";
    try_files $uri $uri/ @solagree_spa_fallback;
}

location / {
    try_files $uri $uri/ =404;
}
error_page 404 /404.html;
# HTML must revalidate so an old document cannot retain deleted hashed chunks.
location ~* \.html$ {
    try_files $uri =404;
}
