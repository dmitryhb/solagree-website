# Dynamic routes (/go/*, /cdfa/go/*, and /webinars/*) load their data only on the
# client, and the static nginx fallback serves /200.html with HTTP 200 for every
# identifier. Until the site has a server/prerender source of valid identifiers,
# these URL families must stay non-indexable: a missing item can only become a noindexed
# soft-404, never a true HTTP 404.
#
# The X-Robots-Tag response header is the crawler-visible noindex signal for
# the initial HTTP response; it does not require client hydration. The rendered
# app also applies a noindex meta tag after hydration (belt-and-braces).
#
# Do NOT replace this with a robots.txt Disallow rule: crawlers must be able to
# fetch these URLs to see the noindex signal. robots.txt blocks crawling, not
# indexing, and is not a substitute for noindex.
#
# Include this file inside the www.solagree.com server block before the SPA fallback:
#   include /etc/nginx/snippets/solagree-co-branded-noindex.conf;

# Nginx normalizes the request URI before location matching, so set this marker
# inside each dynamic location. That covers encoded aliases such as
# `/%67o/example` as well as their canonical paths. Dynamic misses enter a
# named fallback, which serves /200.html without restarting server rewrites and
# clearing the marker.
#
# Keep the output header at server scope: a location-level `add_header`
# replaces inherited server security headers. It appears after the locations
# below so nginx first knows the marker variable they define.
#
# Initialize every request before location matching. This also covers direct,
# encoded, and duplicate-slash aliases of /200.html without raw-URI exceptions.
set $co_branded_noindex_header "";

# Exact locations outrank the dynamic prefix. Keep the public catalogue indexable
# and normalize its trailing slash to the canonical /webinars URL.
location = /webinars {
    try_files /webinars/index.html =404;
}

location = /webinars/ {
    return 301 /webinars;
}

location ^~ /go/ {
    set $co_branded_noindex_header "noindex, nofollow";
    try_files $uri $uri/ @solagree_spa_fallback;
}

location ^~ /cdfa/go/ {
    set $co_branded_noindex_header "noindex, nofollow";
    try_files $uri $uri/ @solagree_spa_fallback;
}

location ^~ /webinars/ {
    set $co_branded_noindex_header "noindex, nofollow";
    try_files $uri $uri/ @solagree_spa_fallback;
}

location @solagree_spa_fallback {
    try_files /200.html =404;
}

add_header X-Robots-Tag $co_branded_noindex_header always;
