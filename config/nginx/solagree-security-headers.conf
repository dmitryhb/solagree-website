# Website-only server headers. Install as solagree-website-security-headers.conf;
# do not replace the live shared Portal snippet with this Website policy.
# Include this again in EVERY location that declares its own add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy $solagree_frame_policy always;
add_header X-Robots-Tag $solagree_environment_robots always;
# Observe provider compatibility on staging before enforcing a full CSP.
# Add the reviewed report-to/report-uri endpoint at deployment if reports are collected.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://solagree.cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://solagree.cal.com https://portal.solagree.com https://portal.qamachine.com; frame-src https://solagree.cal.com https://player.vimeo.com https://www.youtube.com" always;
add_header Cache-Control $solagree_html_cache always;
